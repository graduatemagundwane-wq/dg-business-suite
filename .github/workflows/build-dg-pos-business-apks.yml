name: Build DG POS Business Android APKs
on:
  push:
    branches: [dg-pos-business-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK 35
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" && ls "$ANDROID_HOME/build-tools"
      - name: Build three independent role APKs
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DG-POS-Business-Android-APKs-v0.3.4
          path: |
            app/build/outputs/apk/admin/debug/*.apk
            app/build/outputs/apk/owner/debug/*.apk
            app/build/outputs/apk/worker/debug/*.apk
          if-no-files-found: error
          retention-days: 14
