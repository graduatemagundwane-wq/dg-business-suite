name: Build DG POS Windows Client
on:
  push:
    paths:
      - 'dg-pos-windows/source.b64'
      - '.github/workflows/build-dg-pos-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Expand DG POS source
        shell: pwsh
        run: |
          $b64 = [System.IO.File]::ReadAllText("dg-pos-windows/source.b64")
          [System.IO.File]::WriteAllBytes("dg-pos-windows-source.zip", [System.Convert]::FromBase64String($b64))
          if (Test-Path buildsrc) { Remove-Item buildsrc -Recurse -Force }
          New-Item -ItemType Directory -Path buildsrc | Out-Null
          Expand-Archive -Path dg-pos-windows-source.zip -DestinationPath buildsrc -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: buildsrc/requirements-build.txt

      - name: Install dependencies
        working-directory: buildsrc
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Verify live DG Cloud
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri "https://dg-pos-control-center.vercel.app/api/health" -Method Get
          if (-not $health.ok -or -not $health.desktop) { throw "DG Cloud desktop backend is not ready" }

      - name: Run source QA
        working-directory: buildsrc
        shell: pwsh
        run: |
          python -m py_compile desktop/local_server.py desktop/desktop_app.py
          python tests/live_backend_compat_test.py
          python desktop/desktop_app.py --self-test

      - name: Build single-file Windows EXE
        working-directory: buildsrc
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "DG POS" `
            --icon "desktop/static/dgpos.ico" `
            --add-data "desktop/static;static" `
            --add-data "VERSION;." `
            --paths "desktop" `
            --collect-all webview `
            --collect-all winotify `
            --hidden-import win32print `
            desktop/desktop_app.py

      - name: Test packaged EXE
        working-directory: buildsrc
        shell: pwsh
        run: |
          & ".\dist\DG POS.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged DG POS EXE self-test failed" }

      - name: Package client delivery
        working-directory: buildsrc
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          Copy-Item ".\dist\DG POS.exe" ".\DG-POS-v$version-Windows-x64.exe"
          @"
          DG POS v$version — Double Gee Tech

          INSTALL
          1. Copy the EXE to the Windows computer and open it.
          2. New shop: register the business, then Double Gee Tech approves it.
          3. Existing mobile account: enter the SAME Registration ID during Windows registration.
          4. In DG POS Control Center, approve the Windows device and give the client its activation code.
          5. Enter that activation code on the computer.

          PRINTING
          - View / Print Receipt uses the Windows print dialog and therefore works with installed USB, Bluetooth, Wi-Fi and network printer drivers.
          - Direct Printer is intended for configured ESC/POS thermal printers.
          - Configure the printer under More > Settings.

          STOCK
          - Add opening stock when creating products.
          - Restock through Purchases or positive stock adjustment.
          - Use Inventory > Stock Take for physical counts.
          - Low-stock events create DG POS alerts and Windows toast notifications.

          SECURITY
          - The EXE contains no Double Gee Tech admin key.
          - The account can be frozen, suspended, reactivated or revoked from DG POS Control Center.
          - Windows may show a SmartScreen warning because this build is not Authenticode-signed with a commercial code-signing certificate.
          "@ | Set-Content -Path CLIENT-INSTALL.txt -Encoding UTF8
          Compress-Archive -Path ".\DG-POS-v$version-Windows-x64.exe", ".\CLIENT-INSTALL.txt" -DestinationPath ".\DG-POS-v$version-Client-Kit.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DG-POS-Windows-Client
          path: |
            buildsrc/DG-POS-v*-Windows-x64.exe
            buildsrc/DG-POS-v*-Client-Kit.zip
            buildsrc/CLIENT-INSTALL.txt
          if-no-files-found: error
          retention-days: 30
