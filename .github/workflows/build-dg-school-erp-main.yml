name: Build DG School ERP APK
# rebuild app source 2026-10-09T17:11:48.422Z
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-dg-school-erp-main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dg-school-erp-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android command line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build release APK
        run: gradle -p dg-school-erp-android assembleRelease --stacktrace
      - name: Rename APK
        run: cp dg-school-erp-android/app/build/outputs/apk/release/app-release.apk DG-School-ERP-Pro-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DG-School-ERP-Pro-v1.0
          path: DG-School-ERP-Pro-v1.0.apk
          if-no-files-found: error
