name: Build DG School ERP APK
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-dg-school-erp-main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dg-school-erp-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build release APK
        run: gradle -p dg-school-erp-android assembleRelease --stacktrace
      - name: Rename APK
        run: cp dg-school-erp-android/app/build/outputs/apk/release/app-release.apk DG-School-ERP-Pro-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DG-School-ERP-Pro-v1.0
          path: DG-School-ERP-Pro-v1.0.apk
          if-no-files-found: error
