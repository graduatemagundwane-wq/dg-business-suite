name: ROYAN INC Android APK
on:
  push:
    branches: [royan-android-app]
    paths:
      - '.github/workflows/build-royan-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore ROYAN Android project
        shell: bash
        run: |
          mkdir -p /tmp/royanbuild
          cd /tmp/royanbuild
          echo '' | base64 --decode > source.tar.gz
          tar -xzf source.tar.gz
          test -f royan-android/app/src/main/java/zw/co/doublegeetech/royanadmin/MainActivity.java
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and package APK
        working-directory: /tmp/royanbuild/royan-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Android package signature and manifest
        run: |
          APK=/tmp/royanbuild/royan-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -15
          cp "$APK" "$GITHUB_WORKSPACE/ROYAN-INC-Administration-v1.0.0-debug.apk"
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROYAN-INC-Administration-APK
          path: ROYAN-INC-Administration-v1.0.0-debug.apk
          retention-days: 30
          if-no-files-found: error
