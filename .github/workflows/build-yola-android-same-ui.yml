name: Yola Android Offline Integration APK QA

on:
  push:
    branches:
      - feature/yola-android-ui-parity-20261020
    paths:
      - 'lib/main_yola_android.dart'
      - 'lib/yola_android/**'
      - 'lib/screens/barcode_scan.dart'
      - 'lib/services/pdf_service.dart'
      - 'lib/services/receipt_service.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'yola/windows/brand.webp.b64'
      - '.github/workflows/build-yola-android-same-ui.yml'
  workflow_dispatch:

concurrency:
  group: yola-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify shared Yola desktop/browser UI source
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('yola/offline/desktop/static')
          assert (root/'workspace.html').is_file()
          css = (root/'premium.css').read_text(encoding='utf-8')
          base = (root/'pos.css').read_text(encoding='utf-8')
          assert 'grid-template-columns:266px' in css, 'Desktop Yola sidebar reference changed'
          assert '@media(max-width:780px)' in css, 'Phone/tablet responsive reference missing'
          assert '@media(max-width:760px)' in base, 'Mobile POS source missing'
          assert 'yola-onboarding.vercel.app' in Path('lib/main_yola_android.dart').read_text()
          print('PASS: APK targets the ORIGINAL Yola web UI; not a redesigned Flutter imitation.')
          PY
      - name: Apply official Yola logo as Android launcher icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image, ImageOps
          src = Path('yola/windows/brand.webp.b64')
          img = Image.open(io.BytesIO(base64.b64decode(src.read_text().strip()))).convert('RGBA')
          for density, size in [('mdpi',48), ('hdpi',72), ('xhdpi',96), ('xxhdpi',144), ('xxxhdpi',192)]:
              path = Path(f'android/app/src/main/res/mipmap-{density}/ic_launcher.png')
              path.parent.mkdir(parents=True, exist_ok=True)
              ImageOps.fit(img, (size,size), Image.Resampling.LANCZOS).save(path)
          print('PASS: same official Yola logo used in desktop Windows.')
          PY
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept required Android SDK licences and install pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install "ndk;30.0.14904198"
          test -f "${ANDROID_HOME}/ndk/30.0.14904198/source.properties"
      - name: Install Flutter project dependencies
        run: flutter pub get
      - name: Analyze licensed offline POS and WebView entrypoint
        run: flutter analyze --no-fatal-infos lib/main_yola_android.dart lib/yola_android/ lib/screens/barcode_scan.dart
      - name: Build APK - offline feature integration QA, not production certified
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release -t lib/main_yola_android.dart --build-name 0.2.0 --build-number 2; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Package with clear TEST CANDIDATE status
        run: |
          mkdir -p yola-android-artifact
          cp build/app/outputs/flutter-apk/app-release.apk yola-android-artifact/Yola-Android-Offline-Integration-QA.apk
          sha256sum yola-android-artifact/*.apk > yola-android-artifact/SHA256.txt
          cat > yola-android-artifact/READ-ME-FIRST.txt <<'TXT'
          YOLA Android — offline integration QA, NOT customer production.
          Hosted Yola original interface remains the primary online UI.
          Android sidecar: SQLite transaction-safe cash checkout, durable sync
          outbox, original official DG Ed25519 licence and offline lease check,
          owner PIN, barcode camera scan, Android PDF print/share.
          Real device and printer/scanner acceptance testing still required.
          Master Control hosted activation/status endpoints and cloud sync/event
          reconciliation are required; do not bypass licence gating or mark
          unsynced sales as cloud-complete.
          Flutter DEBUG signing key in use. DO NOT deliver as a signed
          customer release or claim complete offline cloud integration.
          TXT
      - name: Upload Android UI test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yola-Android-Offline-Integration-QA
          retention-days: 30
          if-no-files-found: error
          path: yola-android-artifact/
