name: Build and Verify Eagle Premium Motion
on:
  push:
    branches: [eagle-motion-menu-loader-20261103]
    paths: ['.github/workflows/eagle-build-motion.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Repack original website with interaction changes only
        run: |
          python3 - <<'PY'
          import os,zipfile,hashlib
          archive='eagle-site.zip'
          root='eagle-construction-website/'
          source='eagle-motion-source/'
          patches={'app.js','styles.css','index.html'}
          with zipfile.ZipFile(archive) as original:
            previous=[(info,original.read(info.filename)) for info in original.infolist()]
          expected={root+f for f in patches}
          existing={info.filename for info,_ in previous}
          assert expected <= existing, expected-existing
          replacements={root+name:open(source+name,'rb').read() for name in patches}
          all_assets=[(info.filename,data) for info,data in previous if info.filename.startswith(root+'assets/')]
          assert len(all_assets)>20,'Original site images must remain intact'
          for name in patches:
            assert len(replacements[root+name])>500
          with zipfile.ZipFile(archive+'.next','w') as zipped:
            for info,data in previous:
              zipped.writestr(info,replacements.get(info.filename,data))
          with zipfile.ZipFile(archive+'.next') as zipped:
            assert zipped.testzip() is None
            assert len(zipped.infolist())==len(previous)
            changed=[info.filename for info,data in previous if zipped.read(info.filename)!=data]
            assert set(changed)==expected,changed
            for name,data in all_assets:
              assert zipped.read(name)==data,'Asset unexpectedly changed: '+name
            print('VERIFIED: ONLY',changed)
            print('PRESERVED:',len(all_assets),'asset files, unchanged site pages, form logic and API server')
          os.replace(archive+'.next',archive)
          PY
      - name: Syntax and original site integration tests
        run: |
          mkdir -p /tmp/eagle-motion-test
          unzip -qo eagle-site.zip -d /tmp/eagle-motion-test
          cd /tmp/eagle-motion-test/eagle-construction-website
          node --check app.js
          node --check server.mjs
          node --test tests.mjs
      - name: Verify scoped features and no insecure external load
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('eagle-site.zip') as z:
            app=z.read('eagle-construction-website/app.js').decode()
            css=z.read('eagle-construction-website/styles.css').decode()
            html=z.read('eagle-construction-website/index.html').decode()
          for thing in ['eagleInitMenu','eagleShouldTransition','eagleTransition','eagleAfterRender','eagleAnimatePage','eagleSplitWords','eagleCloseMenu']:
            assert thing in app, thing
          for thing in ['gsap@3.15.0','ScrollTrigger.min.js','lenis@1.3.27']:
            assert thing in app, thing
          for thing in ['id="eagle-opening"','id="eagle-curtain"','id="eagle-progress"']:
            assert thing in html, thing
          for thing in ['.eagle-menu.shown','.eagle-opening','.eagle-curtain.is-in','prefers-reduced-motion']:
            assert thing in css, thing
          print('PASS: loader, menu, transitions, external smooth scroll and reduced-motion paths')
          PY
      - name: Commit verified website archive to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eagle-site.zip
          git diff --cached --quiet && { echo 'No zip changes'; exit 1; }
          git commit -m 'Eagle: premium motion, architectural menu, loader and page transitions'
          git push origin HEAD:eagle-motion-menu-loader-20261103
