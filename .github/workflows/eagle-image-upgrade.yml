name: Upgrade Eagle Construction site images only
on:
  push:
    branches: [deploy-eagle-construction-site-20261103]
    paths: ['.github/workflows/eagle-image-upgrade.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-only-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and replace six existing webp images in original site zip
        env:
          HERO_URL: "https://m.invideo.io/uploads/23235a17-fda0-46f1-ba5e-e2ea7f59788b/23235a17-fda0-46f1-ba5e-e2ea7f59788b?Expires=1793789007&Signature=eoLZGT1BdZuo7SKpBkRhtW2JGWP~bkJKNH-8F4A1PlO0lgpdbpLdnWQFRSh1KzxisNT-GY1BbVj4E~H70FQt27E1m7RFJiiXOov~ki~41BZrAaonkQmp4Po4Gy-ZQc3knbXuEaVf8SRojV-dZzyinnZAAjE~nU3MqGARxrBwtRHRZwJ8MEnqIirb68rVoRy4nCQ0bf-g39CXEvlf7EllYb8CjOd2OPcoaUTRml-dp6SwG4ULN0Ogoz~8R4dWKWgfeKqmtkrLCzUpbUJNFGXgRIHtyYp9IrErHrK6d3j~tSrht4Cf5ObvDfecVIW~-IqOg1sUMfbKckmBQtwllu7REg__&Key-Pair-Id=KX9I6OACHF5M3"
