          SERVICES_URL: "https://m.invideo.io/uploads/ef6859ce-b715-40a2-9f94-e7ec54959f7b/ef6859ce-b715-40a2-9f94-e7ec54959f7b?Expires=1793789011&Signature=cA~S1AweBVGhnTGzyrf059yVRaKdpnY64lGhxP3SQIpUigD7QOyElE9TWuQ601qh4-VoMrRNwETDtOZI5L5vPkoYAsV4HCVANvgzJkC19MgOMsfTtqYc6-Daq350Ai4eDs8IHLJFbudKGCeyU-t3pkoP664D~7lvcn43EfZJTiL3miyY3aeqStCvnfrxB~CURiKY~ZlZa~cSKz6PeCbVhqlPauVXDyvrVX6TDb5FvSqnVbesV0TB9k74dOsxPcIVezJXszlNhKqV6uhhNDnrxTVQjo2Ug9UMAeGt3iCgcF7W02BKv9JAU6QP9iYsSiHNcA9EXUow6YkR1JX~FyKkOQ__&Key-Pair-Id=KX9I6OACHF5M3"
          PROJECTS_URL: "https://m.invideo.io/uploads/f48ff92e-bdee-4086-bb07-9848b7dd11b7/f48ff92e-bdee-4086-bb07-9848b7dd11b7?Expires=1793789014&Signature=o~e125OL4heHTix2c-w5RGUMTbfdKoq5rF7BT-ObwvQgs9JuyTY8dB19aKGRlaik0Qmvh7et2gLJgA8kku6Ky2UebrjcldtLKOTEPXHw~QjKxlBrgdSSd7dYVdEb3hc~S-puD64poiZr3b3J8EYrpzaTXoady5KINNb5Nrfu0p~~F2G-Lljs4aUJPBIGIOSR8mMPFWb1gjcIUtEu8dEnCfq0upWSS1aXxgveLDvRzXUTMrc4bLfDjYe5e6vPaAh8KttGIzMdjcUC-4f9PvZbLPS7E~55YXU1lahCVecbAA4F0uACPAccOWeFRGq8vr8Y1JmeuARWwMMG-Yi~Z7ownw__&Key-Pair-Id=KX9I6OACHF5M3"
          CONTACT_URL: "https://m.invideo.io/uploads/2a3fa4b7-4d32-4546-817c-179aaddad91e/2a3fa4b7-4d32-4546-817c-179aaddad91e?Expires=1793789013&Signature=sJ7TKGxQGDUHU683M2ca19OGBwBb6RR9zqi8Yehvnca3r5gutS9Q4c8JzcPBMPe~bvItrjSj-VopE3ni81EPMYTnEZ5cd7MG~jDQtsjsY80xTh-EjCeiPkr47c90vhJK3C7cZFlJcgcyb1SXfYhYDws5oIStJ7bEPvo9rOL~DBM6ZuXmwAsE36uAeB2qczerDHfT9wDVUngjeBSRJ6ZExp8l8IEvIvYlKLOwJt3EIV-z7CwSyYRHlOWlE2J5wzDBG~Ix38X522wR9Mw5vEa~wtxdwp3eDVvVXayJr95YiaqblK0McMzt504GBwM2SAhCBtGJxRynFKs3w~LfGq5tSw__&Key-Pair-Id=KX9I6OACHF5M3"
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os,zipfile,io,urllib.request
          from PIL import Image
          archive='eagle-site.zip'
          root='eagle-construction-website/assets/'
          aliases={
            'hero-home.webp':'HERO_URL',
            'hero-about.webp':'ABOUT_URL',
            'workers-about.webp':'ABOUT_URL',
            'hero-services.webp':'SERVICES_URL',
            'hero-contact.webp':'CONTACT_URL',
            'project-house.webp':'PROJECTS_URL'
          }
          replacements={}
          for name,env in aliases.items():
            u=os.environ[env]
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as resp:
              raw=resp.read()
            im=Image.open(io.BytesIO(raw)).convert('RGB')
            assert im.width>=1500 and im.height>=850, (name,im.size)
            out=io.BytesIO()
            im.save(out,format='WEBP',quality=93,method=6)
            replacements[root+name]=out.getvalue()
            print('Prepared',name,im.size,len(replacements[root+name]))
          with zipfile.ZipFile(archive,'r') as src:
            originals=[(i,src.read(i.filename)) for i in src.infolist()]
            files={i.filename for i,_ in originals}
          assert replacements.keys()<=files,sorted(replacements.keys()-files)
          with zipfile.ZipFile(archive+'.new','w') as dest:
            for entry,payload in originals:
              dest.writestr(entry,replacements.get(entry.filename,payload))
          with zipfile.ZipFile(archive+'.new') as z:
            assert z.testzip() is None
            for n in replacements:
              assert z.read(n)==replacements[n]
            print('Verified unchanged original site file count',len(originals),'image replacements',len(replacements))
          os.replace(archive+'.new',archive)
          PY
      - name: Commit updated original website package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eagle-site.zip
          git diff --cached --quiet && { echo 'No asset changes'; exit 0; }
          git commit -m 'Replace six Eagle Construction site images with high-resolution regenerated assets'
          git push origin HEAD:deploy-eagle-construction-site-20261103
