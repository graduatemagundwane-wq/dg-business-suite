name: PASH Auto ERP Integration Tests
on:
  push:
    branches:
      - pash-auto-erp-integration-20261103
    paths:
      - 'pash-operations/app/**'
      - '.github/workflows/pash-erp-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated ERP backend requirements
        run: python -m pip install -r pash-operations/app/backend/requirements.txt
      - name: Python syntax validation
        run: python -m compileall -q pash-operations/app/backend
      - name: Backend test suite
        working-directory: pash-operations/app/backend
        run: pytest -q
  android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: pash-operations/app/mobile
        run: npm install --no-audit --no-fund
      - name: Check administration web JavaScript syntax
        run: node --check pash-operations/app/web/app.js
      - name: Test barcode scanner logic
        working-directory: pash-operations/app/mobile
        run: node --test tests/*.test.js
      - name: TypeScript typecheck
        working-directory: pash-operations/app/mobile
        run: npx tsc --noEmit
