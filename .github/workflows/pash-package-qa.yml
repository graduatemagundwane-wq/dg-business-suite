name: Package PASH ERP reviewed QA source
on:
  push:
    branches: [pash-auto-erp-integration-20261103]
    paths:
      - 'pash-operations/tools/build_bundle.py'
      - '.github/workflows/pash-package-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pash-erp-packaging
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pash-auto-erp-integration-20261103
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic QA source archive
        run: python pash-operations/tools/build_bundle.py
      - name: Commit packaged source for existing Render build contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pash-operations/source-v0.5.0.zip.b64
          if git diff --cached --quiet; then
            echo "Source archive already current"
          else
            git commit -m "Package tested PASH ERP attendance integration for QA"
            git push origin HEAD:pash-auto-erp-integration-20261103
          fi
