name: Yola Seven Client Requests Acceptance
on:
  push:
    branches: [feature/yola-client-7-requests-20261024]
    paths:
      - 'yola/offline/**'
      - '.github/workflows/yola-seven-client-acceptance.yml'
  workflow_dispatch:
jobs:
  isolated-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install -r yola/offline/requirements.txt httpx
      - name: Verify Python syntax
        run: python -m compileall -q yola/offline/desktop
      - name: Test seven POS client requests using disposable SQLite data
        run: python yola/offline/test_client_requests.py
      - name: Regression test the shipped offline POS APIs
        run: python yola/offline/test_offline_web.py
      - name: Verify JavaScript syntax
        run: node --check yola/offline/desktop/static/pos.js
