plugins {
    id 'com.android.application'
}
android {
    namespace 'zw.co.doublegeetech.tatezdg'
    compileSdk 35
    defaultConfig {
        applicationId 'zw.co.doublegeetech.tatezdg'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
